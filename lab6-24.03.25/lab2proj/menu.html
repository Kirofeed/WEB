<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Динамическое меню</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .horizontal-menu {
      display: flex;
      background-color: #333;
    }
    .horizontal-menu .menu-item {
      position: relative;
      padding: 14px 16px;
      color: #fff;
      cursor: pointer;
    }
    .horizontal-menu .menu-item:hover {
      background-color: #111;
    }
    .vertical-menu {
      position: absolute;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      display: none;
      flex-direction: column;
      min-width: 150px;
      z-index: 1000;
    }
    .vertical-menu .menu-item {
      padding: 10px;
      color: #333;
      background-color: #f9f9f9;
      border-bottom: 1px solid #ddd;
    }
    .vertical-menu .menu-item:hover {
      background-color: #e0e0e0;
    }
    .menu-item a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="mainHorizontalMenu" class="horizontal-menu"></div>

  <script>
    var MenuA = [
      {name:'О сайте', submenu: 
        [ 
          {name:'Студия звукозаписи', url: 'maket_table.html'},
          {name:'Аранжировка и продакшн', url: 'maket_table.html#Аранжировка и продакшн'}
        ] 
      }, 
      {name: 'Оставить заявку', url: 'form.html'}, 
      {name:'Наши партнеры', submenu: 
        [ 
          {name:'MusicMarket', submenu: 
            [{name: 'Рекламный отдел', url: 'https://musicmarket.by'}]
          }, 
          {name:'Platinum Studio', url: 'https://platinumstudio.by'} 
        ] 
      } 
    ];

    function collapseAllMenus() {
      var openMenus = document.querySelectorAll('.vertical-menu');
      openMenus.forEach(function(menu) {
        menu.style.display = 'none';
      });
    }

    function collapseSiblingSubmenus(menuItem) {
      var parentContainer = menuItem.parentElement;
      if (!parentContainer) return;
      Array.from(parentContainer.children).forEach(function(sibling) {
        if (sibling !== menuItem) {
          var submenu = sibling.querySelector('.vertical-menu');
          if (submenu) {
            submenu.style.display = 'none';
          }
        }
      });
    }

    function ShowMenu(MenuItemsA, ParentElem) {
      var isHorizontal = (ParentElem.id === 'mainHorizontalMenu');
      var menuContainer = document.createElement('div');
      menuContainer.className = isHorizontal ? 'horizontal-menu' : 'vertical-menu';

      MenuItemsA.forEach(function(item) {
        var menuItem = document.createElement('div');
        menuItem.className = 'menu-item';
        
        if (item.url) {
          var link = document.createElement('a');
          link.href = item.url;
          link.textContent = item.name;
          menuItem.appendChild(link);
        } else {
          menuItem.textContent = item.name;
        }

        if (item.submenu && Array.isArray(item.submenu)) {
          menuItem.addEventListener('click', function(e) {
            e.stopPropagation();

            if (ParentElem.id === 'mainHorizontalMenu') {
              collapseAllMenus();
            } else {
              collapseSiblingSubmenus(menuItem);
            }

            var submenu = menuItem.querySelector('.vertical-menu');
            if (submenu && submenu.style.display === 'block') {
              submenu.style.display = 'none';
            } else {
              if (!submenu) {
                ShowMenu(item.submenu, menuItem);
                submenu = menuItem.querySelector('.vertical-menu');
              }
              submenu.style.display = 'block';
            }
          });
        }
        menuContainer.appendChild(menuItem);
      });

      ParentElem.appendChild(menuContainer);

      if (!isHorizontal) {
        if (ParentElem.parentElement && ParentElem.parentElement.classList.contains('vertical-menu')) {
          menuContainer.style.top = "0px";
          menuContainer.style.left = ParentElem.offsetWidth + "px";
        } else {
          menuContainer.style.top = ParentElem.offsetHeight + "px";
          menuContainer.style.left = "0px";
        }
      }
    }

    document.addEventListener('click', function() {
      collapseAllMenus();
    });

    document.addEventListener('DOMContentLoaded', function() {
      var mainMenu = document.getElementById('mainHorizontalMenu');
      ShowMenu(MenuA, mainMenu);
    });
  </script>
</body>
</html>
