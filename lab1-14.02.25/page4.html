<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Студия звукозаписи – Оборудование и услуги</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin: auto;
    }
    table, th, td {
      border: 1px solid #333;
    }
    th, td {
      padding: 8px;
      text-align: center;
    }
    th:nth-child(3) {
      background-color: #df1010;
    }
  </style>
</head>
<body>
  <h2>Оборудование и услуги студии "SoundWave"</h2>
  <table>
    <thead>
      <tr>
        <th>Название товара / услуги</th>
        <th>Стоимость (₽)</th>
        <th>Количество</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Запись вокала</td>
        <td rowspan="2">2500</td>
        <td>1 час</td>
      </tr>
      <tr>
        <td>Запись инструментала</td>
        <td>1 час</td>
      </tr>
      <tr>
        <td>Сведение трека</td>
        <td>1800</td>
        <td>1 трек</td>
      </tr>
      <tr>
        <td>Мастеринг трека</td>
        <td>2200</td>
        <td>1 трек</td>
      </tr>
      <tr>
        <td>Аренда студии (репетиция)</td>
        <td>1500</td>
        <td>1 час</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
